name: Publish Docker image (GHCR)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'yowyob/Drissman'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        shell: bash
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:backend-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:backend-main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://drisman.yowyob.com/drissman-api
          tags: |
            ${{ steps.meta.outputs.image }}:frontend-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:frontend-main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
